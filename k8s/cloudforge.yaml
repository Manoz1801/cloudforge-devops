apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudforge
  template:
    metadata:
      labels:
        app: cloudforge
    spec:
      containers:
        - name: cloudforge
          image: cloudforge:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cloudforge-service
spec:
  type: ClusterIP
  selector:
    app: cloudforge
  ports:
    - port: 80
      targetPort: 5000
